<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altruistic Agent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>Altruistic Agent</h1>
      <p class="sub">Mission District, San Francisco</p>
    </div>
  </div>
  <div class="actions">
    <button id="briefBtn" class="btn">Morning brief</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main class="layout">
  <div id="map" aria-label="Neighborhood map"></div>
  <aside id="panel" class="panel" aria-live="polite"></aside>
</main>

<dialog id="briefDlg" class="dlg">
  <div class="dlg-head">
    <h2>Morning brief</h2>
    <button class="icon-btn" data-close aria-label="Close">&times;</button>
  </div>
  <div id="briefBody" class="dlg-body">Loading...</div>
  <div class="dlg-foot">
    <span id="briefStatus" class="muted"></span>
    <button id="briefSend" class="btn primary">Send to Slack</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
